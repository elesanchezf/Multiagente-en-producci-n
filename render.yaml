# Blueprint de Render para el HR Assistant.
# Limitacion conocida: los intentos con clave invalida no tienen limite por
# origen; el limite de peticiones aplica por cliente ya autenticado.
# No se publica en Render sin una aprobacion separada de una persona.
# El nombre del servicio es igual al del repositorio. Si ya existe un servicio
# con este nombre en la cuenta, Render lo actualizaria en lugar de crear uno.
services:
  - type: web
    name: hr-assistant
    runtime: docker
    plan: free
    healthCheckPath: /health
    # Render publica solo si el pipeline de CI pasa.
    autoDeployTrigger: checksPass
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MODEL_PROVIDER
        value: gateway
      - key: HIDE_INPUTS
        value: "true"
      - key: HIDE_OUTPUTS
        value: "true"
      # Secretos: se escriben en Render, nunca en el repositorio.
      - key: API_KEYS
        sync: false
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_API_TOKEN
        sync: false
      - key: CF_AIG_TOKEN
        sync: false
