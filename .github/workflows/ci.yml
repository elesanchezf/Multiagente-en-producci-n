# Pipeline de CI del HR Assistant: cuatro etapas encadenadas.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Etapa 1: estilo con pylint a 88 columnas.
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pylint app tests --max-line-length=88

  # Etapa 2: pruebas unitarias y BDD con cobertura minima de 80 %.
  unit:
    needs: style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests --cov=app --cov-fail-under=80

  # Etapa 3: Playwright contra el producto con el modelo simulado.
  e2e:
    needs: unit
    runs-on: ubuntu-latest
    env:
      # Clave de prueba de ejemplo (ficticia, no es una clave real).
      E2E_API_KEY: ejemplo-clave-de-prueba-0001
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Arrancar el producto con el modelo simulado
        env:
          MODEL_PROVIDER: fake
          API_KEYS: ci-client:ejemplo-clave-de-prueba-0001
        run: |
          nohup python -m uvicorn app.main:app --port 8000 > server.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fs http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          cat server.log
          exit 1
      - run: python -m pytest e2e --base-url http://127.0.0.1:8000

  # Etapa 4: construir la imagen del contenedor (no se publica).
  docker:
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t hr-assistant:ci .
